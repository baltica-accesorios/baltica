<!doctype html><html><head><meta charset="utf-8"><title>Báltica</title>
<script>
// GitHub Pages SPA fallback: guarda la ruta y redirige al index, que la restaura.
sessionStorage.setItem('spa-path', location.pathname + location.search);
location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/');
</script></head><body></body></html>
